services:
  - type: web
    name: ground-truth-guild
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    routes:
      - type: rewrite
        source: /raters
        destination: /raters.html
      - type: rewrite
        source: /security
        destination: /security.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /sample-report
        destination: /sample-report.html
      - type: rewrite
        source: /compare
        destination: /compare.html
      - type: rewrite
        source: /for/healthcare
        destination: /for/healthcare.html
      - type: rewrite
        source: /for/legal
        destination: /for/legal.html
      - type: rewrite
        source: /for/finance
        destination: /for/finance.html
      - type: rewrite
        source: /for/software
        destination: /for/software.html
      - type: rewrite
        source: /for/security
        destination: /for/security.html
      - type: rewrite
        source: /for/science
        destination: /for/science.html
      - type: rewrite
        source: /for/education
        destination: /for/education.html
      - type: rewrite
        source: /for/languages
        destination: /for/languages.html
